# Render blueprint: one container serving the API and the built UI. Keys are entered in the dashboard, never here.
services:
  - type: web
    name: kisaanmitra
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: LLM_API_KEY
        sync: false
      - key: FALLBACK_API_KEY
        sync: false
      - key: FALLBACK_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: FALLBACK_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free
      - key: FALLBACK2_API_KEY
        sync: false
      - key: FALLBACK2_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: FALLBACK2_MODEL
        value: meta-llama/llama-3.3-70b-instruct:free
      - key: FALLBACK3_API_KEY
        sync: false
      - key: FALLBACK3_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: FALLBACK3_MODEL
        value: google/gemma-3-27b-it:free
      - key: DATA_GOV_API_KEY
        sync: false
      - key: MANDI_FILTER_STYLE
        value: lower
      - key: CORS_ORIGINS
        value: https://kisaanmitra-fcfm.onrender.com
      # Investment advisory: Govt-fixed fertilizer MRP (2025-26, PIB/MoAFW notification). Update if policy changes.
      - key: FERTILIZER_MRP_UREA
        value: "242"
      - key: FERTILIZER_MRP_DAP
        value: "1350"
      - key: FERTILIZER_MRP_MOP
        value: "1700"
      - key: FERTILIZER_MRP_NPK
        value: "1470"
      # Optional: set FERTILIZER_RESOURCE_ID to a data.gov.in resource ID for live fertilizer prices
      - key: FERTILIZER_RESOURCE_ID
        value: ""
